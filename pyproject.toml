[project]
name = "hardenelf"
version = "0.1.0"
description = "Prototype binary rewriter for injecting selectable hardening passes into ELF binaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "capstone>=5",
    "keystone-engine>=0.9.2",
    "lief>=0.17",
]

[project.scripts]
hardenelf = "binary_hardening.cli:main"

[tool.setuptools.packages.find]
include = [
    "binary_hardening*",
    "shstk_injector*",
    "safe_rng*",
    "fmtstr_checker*",
    "initialize_frames*",
]

[tool.setuptools.package-data]
safe_rng = ["native/*.c"]
fmtstr_checker = ["native/*.c"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

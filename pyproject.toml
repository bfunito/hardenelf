[project]
name = "shstk-injector"
version = "0.1.0"
description = "Prototype binary rewriter for injecting a software shadow stack into ELF binaries."
readme = "PROJECT.md"
requires-python = ">=3.11"
dependencies = [
    "capstone>=5",
    "keystone-engine>=0.9.2",
    "lief>=0.17",
]

[project.scripts]
shstk-injector = "shstk_injector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
